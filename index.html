<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Mind Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: notes open as fixed-width panes left to right; older panes fold into title spines. */
:root {
  --paper: #f3f5f1;
  --leaf: #ffffff;
  --ink: #1d2420;
  --stem: #5f6b64;
  --moss: #2f6b4a;
  --moss-wash: rgba(47, 107, 74, 0.09);
  --moss-strong: rgba(47, 107, 74, 0.22);
  --rule: #dfe4de;
  --well: #eef1ec;
  --shade: rgba(20, 35, 27, 0.10);
  --warn: #a8432f;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pane-w: 600px;
  --spine: 40px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121614; --leaf: #1a1f1c; --ink: #e2e7e3; --stem: #9aa59f; --moss: #7fc29a;
    --moss-wash: rgba(127, 194, 154, 0.10); --moss-strong: rgba(127, 194, 154, 0.25);
    --rule: #2b322e; --well: #222824; --shade: rgba(0, 0, 0, 0.45); --warn: #e58a74;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121614; --leaf: #1a1f1c; --ink: #e2e7e3; --stem: #9aa59f; --moss: #7fc29a;
  --moss-wash: rgba(127, 194, 154, 0.10); --moss-strong: rgba(127, 194, 154, 0.25);
  --rule: #2b322e; --well: #222824; --shade: rgba(0, 0, 0, 0.45); --warn: #e58a74;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 16.5px/1.65 var(--serif);
}
#app { height: 100%; display: flex; flex-direction: column; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--moss); outline-offset: 2px; }

/* ---------- header ---------- */
.bar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
  font-family: var(--sans);
  font-size: 14px;
}
.bar .name { font-weight: 600; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; font-size: 15px; }
.bar .tip { color: var(--stem); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn {
  border: 1px solid var(--rule);
  background: var(--leaf);
  border-radius: 6px;
  padding: 5px 12px;
  font-family: var(--sans);
  font-size: 13.5px;
  cursor: pointer;
  white-space: nowrap;
}
.btn:hover { border-color: var(--moss); }
.btn.primary { background: var(--moss); border-color: var(--moss); color: var(--leaf); font-weight: 600; }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); border-color: var(--warn); color: var(--leaf); }
.btn:disabled { opacity: 0.5; cursor: default; }

/* ---------- panes ---------- */
#stack { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; }
.pane {
  flex: 0 0 var(--pane-w);
  width: var(--pane-w);
  position: sticky;
  left: calc(var(--i, 0) * var(--spine));
  overflow: hidden;
  background: var(--leaf);
  border-right: 1px solid var(--rule);
  transition: background-color 0.4s;
}
.pane.overlapped + .pane { box-shadow: -6px 0 14px var(--shade); }
.pane.flash { background: var(--moss-strong); }
.pane > .scroll { height: 100%; overflow-y: auto; }
.page { padding: 26px 36px 72px; transition: opacity 0.15s; }
.pane.obscured .page, .pane.obscured .tools { opacity: 0; pointer-events: none; }
.spine {
  display: none;
  position: absolute; inset: 0 auto 0 0;
  width: var(--spine);
  padding: 18px 0;
  writing-mode: vertical-lr;
  line-height: var(--spine);
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  cursor: pointer; user-select: none;
}
.pane.obscured .spine { display: block; }
.tools { position: absolute; top: 10px; right: 12px; display: flex; gap: 6px; z-index: 1; }
.tools button {
  border: 0; background: var(--leaf); color: var(--stem);
  font-family: var(--sans); font-size: 13px; padding: 3px 9px; border-radius: 5px; cursor: pointer;
}
.tools button:hover { background: var(--moss-wash); color: var(--ink); }

/* ---------- reading ---------- */
.page h1 { font-size: 1.65em; line-height: 1.2; font-weight: 600; margin: 0.6em 0 0.75em; padding-right: 90px; text-wrap: balance; }
.page h2 { font-size: 1.22em; margin-top: 1.6em; text-wrap: balance; }
.page h3 { font-size: 1.05em; }
.page blockquote { margin: 1em 0; padding-left: 1em; border-left: 3px solid var(--rule); color: var(--stem); }
.page code { background: var(--well); padding: 0.1em 0.3em; border-radius: 3px; font-size: 0.86em; }
.page pre { background: var(--well); padding: 12px; border-radius: 6px; overflow-x: auto; }
.page pre code { background: none; padding: 0; }
.page a { color: var(--moss); }
a.note { text-decoration: none; background: var(--moss-wash); border-radius: 3px; padding: 0 2px; }
a.note:hover { text-decoration: underline; }
a.note.open { background: var(--moss-strong); }
.missing { color: var(--stem); border-bottom: 1px dashed var(--stem); }
.can-edit .missing { cursor: pointer; }
.can-edit .missing:hover { color: var(--moss); border-color: var(--moss); }
.empty { color: var(--stem); font-style: italic; }

.backlinks { margin-top: 3em; padding: 14px 16px; border-radius: 8px; background: var(--well); font-size: 0.86em; }
.backlinks h3 {
  margin: 0 0 6px; font-family: var(--sans); font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--stem);
}
.backlink { padding: 8px 10px; margin: 0 -10px; border-radius: 6px; cursor: pointer; }
.backlink:hover { background: var(--moss-wash); }
.backlink > a.note { background: none; padding: 0; font-family: var(--sans); font-weight: 600; font-size: 13.5px; }
.backlink .ctx { color: var(--stem); }
.backlink .ctx p { margin: 3px 0 0; }
.backlink .ctx .ref { color: var(--ink); }

/* ---------- editing ---------- */
.editor { display: flex; flex-direction: column; gap: 12px; padding: 22px 28px 28px; min-height: 100%; }
.editor label { font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--stem); letter-spacing: 0.04em; text-transform: uppercase; }
.editor .title-input {
  width: 100%; border: 0; border-bottom: 1px solid var(--rule); background: none;
  font-size: 1.5em; font-weight: 600; padding: 4px 0;
}
.editor .title-input:focus { outline: none; border-color: var(--moss); }
.editor textarea {
  flex: 1; min-height: 280px; width: 100%; resize: none;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--paper);
  padding: 14px; font: 15px/1.6 var(--serif);
}
.editor textarea:focus { outline: none; border-color: var(--moss); }
.help { font-family: var(--sans); font-size: 13px; color: var(--stem); line-height: 1.5; }
.help code { background: var(--well); padding: 1px 5px; border-radius: 3px; color: var(--ink); }
.linker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--sans); font-size: 13.5px; }
.linker select { border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; background: var(--leaf); max-width: 100%; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.actions .spacer { flex: 1; }
.signin { display: flex; gap: 6px; align-items: center; }
.signin input { border: 1px solid var(--rule); border-radius: 6px; padding: 4px 8px; background: var(--leaf); width: 150px; font-family: var(--sans); font-size: 13.5px; }
.bar .msg { font-family: var(--sans); font-size: 13px; color: var(--warn); }
.account { min-width: 0; }
.loading { padding: 40px 36px; color: var(--stem); font-family: var(--sans); }
.status { font-family: var(--sans); font-size: 13px; color: var(--warn); }

/* ---------- hover preview ---------- */
.preview {
  position: fixed; z-index: 10; width: 400px; max-height: 300px; overflow: hidden;
  background: var(--leaf); border: 1px solid var(--rule); border-radius: 8px;
  box-shadow: 0 12px 32px var(--shade); pointer-events: none; font-size: 13px;
}
.preview .page { padding: 14px 18px; }
.preview .page h1 { padding-right: 0; }
.preview .backlinks { display: none; }
.preview::after { content: ""; position: absolute; inset: auto 0 0 0; height: 56px; background: linear-gradient(transparent, var(--leaf)); }

@media (max-width: 760px) {
  :root { --pane-w: 100vw; --spine: 0px; }
  .bar .tip { display: none; }
  .bar { flex-wrap: wrap; }
  .bar .name { flex: 1; text-align: left; }
  #stack { scroll-snap-type: x mandatory; }
  .pane { scroll-snap-align: start; }
  .page, .editor {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .preview { display: none; }
}
@media (prefers-reduced-motion: reduce) { #stack { scroll-behavior: auto; } * { transition: none !important; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="app"><p class="loading">Loading notes&hellip;</p></div>
</body>
</html>
